name: Release

# Tag a release to build and publish Windows + macOS artifacts:
#   git tag xtm/v1.10.0 && git push origin xtm/v1.10.0
#   git tag tam/v0.1.0  && git push origin tam/v0.1.0
# The tag's prefix names the app, and the resolve job below turns it into the
# directory, product name and binary name the build jobs use. Both jobs upload
# to the same GitHub Release for the tag.
#
# Adding an app means adding its prefix here and a matching entry in resolve.
# The instruction gate fails when an app carrying a wails.json has no prefix,
# so a new app cannot be left unreleasable in silence (#154).

on:
  push:
    tags: ["xtm/v*", "tam/v*"]
  workflow_dispatch:
    inputs:
      app:
        description: "App to build"
        required: true
        type: choice
        options: [xtm, tam]
      version:
        description: "Version to build (x.y.z), no leading v"
        required: true

permissions:
  contents: write

# Run JavaScript actions on Node 24 — Node 20 is deprecated on GitHub runners.
# Covers any action still shipping a Node 20 entrypoint (e.g. the third-party
# release action) in addition to the version bumps below.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # One place decides which app a run is for, so neither build job parses the
  # tag itself and the two cannot disagree about it. The product name is read
  # from the app's wails.json rather than written here, which is the same
  # source scripts/release-app.ps1 reads.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.r.outputs.app }}
      version: ${{ steps.r.outputs.version }}
      product: ${{ steps.r.outputs.product }}
      binary: ${{ steps.r.outputs.binary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: r
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            app="${{ github.event.inputs.app }}"
            version="${{ github.event.inputs.version }}"
          else
            app="${GITHUB_REF_NAME%%/*}"
            version="${GITHUB_REF_NAME#*/v}"
          fi
          if [ ! -f "$app/wails.json" ]; then
            echo "::error::No app at '$app': $app/wails.json does not exist. The tag prefix names the app directory."
            exit 1
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version '$version' is not semver (expected x.y.z)."; exit 1 ;;
          esac
          product=$(node -e "process.stdout.write(require('./$app/wails.json').info.productName)")
          binary=$(node -e "process.stdout.write(require('./$app/wails.json').outputfilename)")
          {
            echo "app=$app"
            echo "version=$version"
            echo "product=$product"
            echo "binary=$binary"
          } >> "$GITHUB_OUTPUT"
          echo "Building $product v$version from $app/"

  release-windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Pinned to match go.mod. The Wails CLI rewrites go.mod to its own
      # version on every invocation, so @latest silently changes the module
      # requirement and the released binary's Wails version drifts with it.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress

      - name: Build & bundle
        shell: pwsh
        run: ./scripts/release-app.ps1 -App ${{ needs.resolve.outputs.app }} -Version ${{ needs.resolve.outputs.version }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.resolve.outputs.product }} v${{ needs.resolve.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ needs.resolve.outputs.app }}/dist/*.exe
            ${{ needs.resolve.outputs.app }}/dist/*.zip
            ${{ needs.resolve.outputs.app }}/dist/SHA256SUMS.txt

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.resolve.outputs.binary }}-${{ needs.resolve.outputs.version }}
          path: ${{ needs.resolve.outputs.app }}/dist/*

  release-macos:
    needs: resolve
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      # Pinned to match go.mod. The Wails CLI rewrites go.mod to its own
      # version on every invocation, so @latest silently changes the module
      # requirement and the released binary's Wails version drifts with it.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build universal .app
        working-directory: ${{ needs.resolve.outputs.app }}
        run: wails build -platform darwin/universal -clean

      # --- Code signing + notarization (optional) ---
      # All steps below are skipped unless the signing secrets are configured, so
      # the workflow still publishes an (unsigned) .app out of the box. To enable,
      # set repo secrets: MACOS_CERTIFICATE_P12 (base64 of a "Developer ID
      # Application" .p12), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY,
      # and for notarization MACOS_NOTARY_APPLE_ID / _TEAM_ID / _PASSWORD
      # (an app-specific password).
      - name: Check signing secrets
        id: sign
        run: |
          if [ -n "${{ secrets.MACOS_CERTIFICATE_P12 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not set — publishing an unsigned .app"
          fi
          if [ -n "${{ secrets.MACOS_NOTARY_PASSWORD }}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.sign.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Codesign .app
        if: steps.sign.outputs.enabled == 'true'
        working-directory: ${{ needs.resolve.outputs.app }}/build/bin
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "${{ needs.resolve.outputs.binary }}.app"
          codesign --verify --strict --verbose=2 "${{ needs.resolve.outputs.binary }}.app"

      - name: Notarize + staple
        if: steps.sign.outputs.enabled == 'true' && steps.sign.outputs.notarize == 'true'
        working-directory: ${{ needs.resolve.outputs.app }}/build/bin
        run: |
          ditto -c -k --keepParent "${{ needs.resolve.outputs.binary }}.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.MACOS_NOTARY_TEAM_ID }}" \
            --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" --wait
          xcrun stapler staple "${{ needs.resolve.outputs.binary }}.app"

      - name: Package .app (zip + checksum)
        working-directory: ${{ needs.resolve.outputs.app }}/build/bin
        run: |
          app="${{ needs.resolve.outputs.binary }}.app"
          out="${{ needs.resolve.outputs.binary }}-${{ needs.resolve.outputs.version }}-macos-universal.zip"
          # ditto preserves the bundle structure and resource forks for a valid .app zip.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          shasum -a 256 "$out" > "SHA256SUMS-macos.txt"
          ls -la

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.resolve.outputs.product }} v${{ needs.resolve.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ needs.resolve.outputs.app }}/build/bin/*.zip
            ${{ needs.resolve.outputs.app }}/build/bin/SHA256SUMS-macos.txt

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.resolve.outputs.binary }}-macos-${{ needs.resolve.outputs.version }}
          path: ${{ needs.resolve.outputs.app }}/build/bin/*.zip
