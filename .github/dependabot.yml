version: 2
updates:
  # Keep the SHA-pinned GitHub Actions in .github/workflows current — Dependabot
  # bumps both the pin and the version comment when a new release lands.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Go modules: the XTM app, TAM, and the shared core (the root holds only go.work).
  - package-ecosystem: "gomod"
    directories: ["/xtm", "/core", "/tam"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # npm (workspace root; the lock file and node_modules are shared across the
  # three frontend packages).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      frontend:
        patterns: ["*"]
