version: 2
updates:
  # Keep the SHA-pinned GitHub Actions in .github/workflows current — Dependabot
  # bumps both the pin and the version comment when a new release lands.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Go modules: the XTM app, TAM, and the shared core (the root holds only go.work).
  - package-ecosystem: "gomod"
    directories: ["/xtm", "/core", "/tam"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # npm (workspace root; the lock file and node_modules are shared across the
  # three frontend packages).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # eslint 10 cannot be installed here: eslint-plugin-jsx-a11y stops at a
      # peer range of eslint 9 and 6.10.2 is its latest release, so the whole
      # grouped PR fails at npm ci (#344, which split #292 to get the rest of
      # the updates in). Accessibility lints are an invariant (I3) and
      # eslint_a11y is a ratchet counter, so the plugin stays and eslint waits.
      # Drop these two entries once jsx-a11y ships support for eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
