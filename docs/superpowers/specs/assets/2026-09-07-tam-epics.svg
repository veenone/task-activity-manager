  <!-- detail panel -->
  <rect x="848" y="136" width="372" height="620" class="surface"/>
  <text x="864" y="164" class="txt b" font-size="15">PLAT-412</text>
  <rect x="938" y="150" width="40" height="16" rx="8" fill="#DCFCE7"/><text x="945" y="162" fill="#166534" class="xs b">Story</text>
  <circle cx="990" cy="158" r="3.5" fill="#F59E0B"/>
