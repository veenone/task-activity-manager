  <line x1="848" y1="228" x2="1220" y2="228" stroke="#E1E4EA"/>
  <g class="sm">
    <text x="864" y="254" class="muted">Status</text><text x="960" y="254" class="txt">In Progress</text>
    <text x="864" y="276" class="muted">Sprint</text><text x="960" y="276" class="txt">Sprint 12</text>
    <text x="864" y="298" class="muted">Updated</text><text x="960" y="298" class="txt">today 09:58</text>
  </g>
  <text x="864" y="330" class="txt b">Fields</text>
  <g class="sm">
    <text x="864" y="358" class="muted">Summary</text>
    <rect x="960" y="344" width="244" height="22" rx="3" class="surface"/><text x="968" y="359" class="txt">Checkout: apply promo code at payment step</text>
    <text x="864" y="388" class="muted">Epic</text>
    <rect x="960" y="374" width="244" height="22" rx="3" fill="#FFFBEB" stroke="#F59E0B"/><text x="968" y="389" class="txt">PLAT-320 Checkout experience</text>
    <text x="864" y="418" class="muted">Priority</text>
    <rect x="960" y="404" width="244" height="22" rx="3" class="surface"/><text x="968" y="419" class="txt">High</text>
    <text x="864" y="448" class="muted">Story points</text>
    <rect x="960" y="434" width="244" height="22" rx="3" class="surface"/><text x="968" y="449" class="txt">8</text>
    <text x="864" y="478" class="muted">Assignee</text>
    <rect x="960" y="464" width="244" height="22" rx="3" class="surface"/><text x="968" y="479" class="txt">R. Anand</text>
  </g>
  <rect x="864" y="500" width="84" height="26" rx="4" class="accent"/>
  <text x="878" y="517" fill="#FFFFFF" class="b sm">Save edit</text>
  <text x="960" y="517" class="muted sm">Moving to PLAT-320 is journaled; Commit pushes it.</text>

  <!-- status bar -->
  <rect x="0" y="772" width="1240" height="28" fill="#FFFFFF" stroke="#E1E4EA"/>
  <text x="196" y="790" class="muted sm">61 issues, last synced today 10:42</text>
  <rect x="1000" y="777" width="154" height="18" rx="9" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="1010" y="790" class="xs b" fill="#92400E">2 pending changes: Commit</text>
</svg>
