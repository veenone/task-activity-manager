    <text x="216" y="368" class="txt">▸</text>
    <rect x="234" y="358" width="34" height="14" rx="7" fill="#EDE9FE"/><text x="241" y="369" fill="#5B21B6" class="xs b">Epic</text>
    <text x="278" y="368" class="txt b">PLAT-320</text>
    <text x="344" y="368" class="txt">Checkout experience</text>
    <text x="640" y="368" class="muted">6 of 14 done, 34 pts</text>

    <rect x="200" y="378" width="632" height="30" class="row-alt"/>
    <text x="216" y="398" class="txt">▸</text>
    <rect x="234" y="388" width="34" height="14" rx="7" fill="#EDE9FE"/><text x="241" y="399" fill="#5B21B6" class="xs b">Epic</text>
    <text x="278" y="398" class="txt b">PLAT-310</text>
    <text x="344" y="398" class="txt">Payments platform hardening</text>
    <text x="640" y="398" class="muted">1 of 9 done, 13 pts</text>

    <rect x="200" y="408" width="632" height="30" fill="#FFFFFF"/>
    <text x="216" y="428" class="txt">▸</text>
    <rect x="234" y="418" width="34" height="14" rx="7" fill="#EDE9FE"/><text x="241" y="429" fill="#5B21B6" class="xs b">Epic</text>
    <text x="278" y="428" class="txt b">PLAT-305</text>
    <text x="344" y="428" class="txt">Team rituals and process</text>
    <text x="640" y="428" class="muted">3 of 3 done, 5 pts</text>

    <rect x="200" y="438" width="632" height="30" class="row-alt"/>
    <text x="216" y="458" class="txt">▸</text>
    <text x="278" y="458" class="txt b">No epic</text>
    <text x="640" y="458" class="muted">18 issues</text>
