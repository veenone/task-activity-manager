  <rect x="740" y="96" width="92" height="28" rx="4" class="accent"/>
  <text x="754" y="114" fill="#FFFFFF" class="b">+ New epic</text>

  <!-- tree -->
  <rect x="200" y="136" width="632" height="620" class="surface"/>
  <g class="sm">
    <text x="216" y="162" class="txt b">All epics</text>
    <text x="290" y="162" class="muted">4</text>

    <!-- epic: Promotions and discounts, expanded -->
    <rect x="200" y="174" width="632" height="30" class="row-alt"/>
    <text x="216" y="194" class="txt">▾</text>
    <rect x="234" y="184" width="34" height="14" rx="7" fill="#EDE9FE"/><text x="241" y="195" fill="#5B21B6" class="xs b">Epic</text>
