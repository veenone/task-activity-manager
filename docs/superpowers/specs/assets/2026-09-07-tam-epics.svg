    <rect x="200" y="204" width="632" height="28" class="row-sel"/>
    <rect x="252" y="212" width="40" height="14" rx="7" fill="#DCFCE7"/><text x="259" y="223" fill="#166534" class="xs b">Story</text>
    <text x="300" y="222" class="txt b">PLAT-412</text>
    <text x="366" y="222" class="txt">Checkout: apply promo code at payment step</text>
    <rect x="660" y="212" width="72" height="14" rx="3" fill="#DBEAFE"/><text x="666" y="223" fill="#1E40AF" class="xs b">In Progress</text>
    <text x="760" y="222" class="txt">8</text>
    <circle cx="816" cy="218" r="3.5" fill="#F59E0B"/>

    <rect x="200" y="232" width="632" height="28" fill="#FFFFFF"/>
    <rect x="252" y="240" width="48" height="14" rx="7" fill="#FEE2E2"/><text x="259" y="251" fill="#991B1B" class="xs b">Req</text>
    <text x="308" y="250" class="txt">PLAT-388</text>
    <text x="374" y="250" class="txt">Promo codes must be single-use per customer</text>
    <rect x="660" y="240" width="60" height="14" rx="3" fill="#DCFCE7"/><text x="666" y="251" fill="#166534" class="xs b">Approved</text>
    <text x="760" y="250" class="txt">-</text>

    <rect x="200" y="260" width="632" height="28" class="row-alt"/>
    <rect x="252" y="268" width="40" height="14" rx="7" fill="#DCFCE7"/><text x="259" y="279" fill="#166534" class="xs b">Story</text>
    <text x="300" y="278" class="txt">PLAT-398</text>
    <text x="366" y="278" class="txt">Show the discount breakdown on the order summary</text>
    <rect x="660" y="268" width="44" height="14" rx="3" fill="#F3F4F6"/><text x="666" y="279" fill="#374151" class="xs b">To Do</text>
    <text x="760" y="278" class="txt">3</text>

    <rect x="200" y="288" width="632" height="28" fill="#FFFFFF"/>
    <rect x="252" y="296" width="34" height="14" rx="7" fill="#FECACA"/><text x="259" y="307" fill="#7F1D1D" class="xs b">Bug</text>
    <text x="294" y="306" class="txt">PLAT-390</text>
    <text x="360" y="306" class="txt">Promo code field accepts whitespace-only input</text>
    <rect x="660" y="296" width="44" height="14" rx="3" fill="#F3F4F6"/><text x="666" y="307" fill="#374151" class="xs b">To Do</text>
