<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="PIE charts: the Project map tree grouped by status, the Link map flow with a Left side chooser and full project names, and the network with zoom controls, a key-sized centre and a legend">
  <style>
    text { font-family: Segoe UI, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .muted { fill: #656d76; font-size: 12px; }
    .cap { fill: #656d76; font-size: 12px; font-weight: 600; }
    .mono { font-family: Consolas, monospace; }
    .on { fill: #ffffff; font-weight: 600; }
  </style>
  <rect width="1200" height="640" fill="#ffffff"/>

  <text x="16" y="22" class="cap">PROJECT MAP, TREE: Group by status</text>
  <rect x="16" y="34" width="14" height="14" rx="3" fill="#3b5bdb"/>
  <text x="19" y="46" class="on" style="font-size:11px">✓</text>
  <text x="38" y="46">Group by status</text>
  <rect x="16" y="64" width="150" height="26" rx="4" fill="#f5f6f8" stroke="#e3e6ea"/>
  <text x="26" y="82">Baseline Card OS</text>
  <line x1="166" y1="77" x2="190" y2="77" stroke="#c9ced6"/>
  <rect x="190" y="64" width="200" height="26" rx="4" fill="#f5f6f8" stroke="#e3e6ea"/>
  <text x="200" y="82">Reader (RDR)</text>
  <text x="300" y="82" class="muted">12 of 340 fixed</text>
  <line x1="390" y1="77" x2="414" y2="77" stroke="#c9ced6"/>
  <text x="414" y="72">▸ Closed</text><text x="484" y="72" class="muted">12</text>
  <text x="414" y="96">▾ Open</text><text x="484" y="96" class="muted">301</text>
  <text x="430" y="118" class="mono">RDR-12</text><text x="488" y="118" class="muted">Open</text>
  <text x="430" y="138" class="mono">RDR-40</text><text x="488" y="138" class="muted">Open</text>
  <text x="430" y="158" class="muted">…</text>
  <text x="414" y="180">▸ In Progress</text><text x="510" y="180" class="muted">27</text>

  <text x="620" y="22" class="cap">LINK MAP, NETWORK: zoom, a centre that fits its key, a legend</text>
  <text x="620" y="50" class="muted">Centre project</text>
  <rect x="716" y="36" width="170" height="24" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="726" y="53">ALPHABETA</text>
  <rect x="900" y="36" width="24" height="24" rx="4" fill="#fff" stroke="#c9ced6"/><text x="908" y="53">−</text>
  <text x="932" y="53" class="muted">125%</text>
  <rect x="970" y="36" width="24" height="24" rx="4" fill="#fff" stroke="#c9ced6"/><text x="977" y="53">+</text>
  <rect x="1000" y="36" width="52" height="24" rx="4" fill="#fff" stroke="#c9ced6"/><text x="1008" y="53">Reset</text>
  <line x1="900" y1="160" x2="1090" y2="110" stroke="#c9ced6" stroke-width="3"/>
  <line x1="900" y1="160" x2="1080" y2="230" stroke="#c9ced6" stroke-width="1.5"/>
  <line x1="900" y1="160" x2="720" y2="120" stroke="#c9ced6" stroke-width="2"/>
  <circle cx="900" cy="160" r="50" fill="#3b5bdb"/>
  <text x="900" y="165" text-anchor="middle" class="on">ALPHABETA</text>
  <circle cx="1090" cy="110" r="7" fill="#fff" stroke="#3b5bdb" stroke-width="2"/><text x="1090" y="96" text-anchor="middle">Reader</text>
  <circle cx="1080" cy="230" r="7" fill="#fff" stroke="#3b5bdb" stroke-width="2"/><text x="1080" y="252" text-anchor="middle">Card OS</text>
  <circle cx="720" cy="120" r="7" fill="#fff" stroke="#3b5bdb" stroke-width="2"/><text x="720" y="106" text-anchor="middle">Area Reports</text>
  <circle cx="626" cy="284" r="5" fill="#3b5bdb"/><text x="636" y="288" class="muted">Centre: the project chosen, or the busiest</text>
  <circle cx="626" cy="304" r="5" fill="#fff" stroke="#3b5bdb" stroke-width="2"/><text x="636" y="308" class="muted">Around it: the projects its issues link to, one spoke per link type</text>
  <text x="620" y="328" class="muted">→ Arrow away from the centre: its issues link out to that project</text>
  <text x="620" y="348" class="muted">← Arrow towards the centre: that project's issues link in</text>
  <rect x="620" y="360" width="18" height="4" fill="#c9ced6"/><text x="644" y="366" class="muted">A thicker spoke has more links</text>

  <text x="16" y="410" class="cap">LINK MAP, FLOW: Left side keeps chosen projects; long names get room, the chart scrolls sideways</text>
  <text x="16" y="436">Left side</text>
  <rect x="80" y="422" width="220" height="24" rx="4" fill="#fff" stroke="#c9ced6"/>
  <text x="90" y="439" class="muted">Every project</text>
  <rect x="310" y="422" width="190" height="24" rx="12" fill="#eef0f3"/>
  <text x="322" y="439">Card Platform Firmware (CPF)  ×</text>
  <rect x="16" y="458" width="1168" height="166" fill="#fff" stroke="#e3e6ea"/>
  <text x="270" y="510" text-anchor="end">Card Platform Firmware (CPF) 14</text>
  <rect x="276" y="480" width="10" height="70" fill="#3b5bdb"/>
  <path d="M286 480 C 420 480, 420 470, 540 470 L 540 520 C 420 520, 420 530, 286 530 Z" fill="#3b5bdb" opacity="0.25"/>
  <path d="M286 530 C 420 530, 420 560, 540 560 L 540 580 C 420 580, 420 550, 286 550 Z" fill="#3b5bdb" opacity="0.25"/>
  <rect x="540" y="470" width="10" height="50" fill="#8a94a6"/><text x="556" y="500">Cloners 10</text>
  <rect x="540" y="560" width="10" height="20" fill="#8a94a6"/><text x="556" y="574">Blocks 4</text>
  <path d="M550 470 C 680 470, 680 480, 800 480 L 800 530 C 680 530, 680 520, 550 520 Z" fill="#3b5bdb" opacity="0.25"/>
  <path d="M550 560 C 680 560, 680 560, 800 560 L 800 580 C 680 580, 680 580, 550 580 Z" fill="#3b5bdb" opacity="0.25"/>
  <rect x="800" y="480" width="10" height="50" fill="#3b5bdb"/><text x="816" y="510">Reader Firmware for Contactless Terminals (RFT) 10</text>
  <rect x="800" y="560" width="10" height="20" fill="#3b5bdb"/><text x="816" y="574">Area Reports (ARP) 4</text>
  <rect x="16" y="614" width="1168" height="8" fill="#f5f6f8"/>
  <rect x="16" y="614" width="840" height="8" rx="4" fill="#c9ced6"/>
</svg>
