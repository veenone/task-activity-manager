<svg xmlns="http://www.w3.org/2000/svg" width="820" height="568" viewBox="0 0 820 568" role="img" aria-label="Mockup of the profile dialog with Zephyr Essential selected as the backend">
  <title>Profile dialog, Zephyr Essential backend</title>
  <desc>Profile setup showing a three-way backend selector with Zephyr Essential chosen, the Jira URL and personal access token fields reused from the Xray path, a detected-capabilities panel listing what the instance reports, and a plain warning naming the four features Zephyr Essential does not have.</desc>

  <defs>
    <style>
      .t      { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      .mono   { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
      .title  { font-size: 16px; font-weight: 600; fill: #1f2933; }
      .lbl    { font-size: 12px; fill: #6b7280; }
      .body   { font-size: 13px; fill: #1f2933; }
      .muted  { font-size: 13px; fill: #6b7280; }
      .small  { font-size: 12px; fill: #6b7280; }
      .ok     { font-size: 12px; fill: #1b6b3a; }
      .no     { font-size: 12px; fill: #8a4b0f; }
      .warn   { font-size: 13px; fill: #925b0a; }
      .card   { fill: #ffffff; stroke: #d6dbe1; }
      .field  { fill: #ffffff; stroke: #c3cad2; }
      .seg    { fill: #f4f6f8; stroke: #c3cad2; }
      .segon  { fill: #1f6feb; stroke: #1f6feb; }
      .panel  { fill: #f8fafc; stroke: #e3e8ee; }
      .btn    { fill: #1f6feb; stroke: #1f6feb; }
      .btng   { fill: #ffffff; stroke: #c3cad2; }
      .onlbl  { font-size: 13px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>

  <rect width="820" height="568" fill="#eef1f4"/>
  <rect x="20" y="18" width="780" height="532" rx="6" class="card"/>

  <text x="40" y="48" class="t title">Edit profile</text>
  <line x1="20" y1="64" x2="800" y2="64" stroke="#e3e8ee"/>

  <text x="40" y="92" class="t lbl">PROFILE NAME</text>
  <rect x="40" y="100" width="340" height="30" rx="4" class="field"/>
  <text x="50" y="120" class="t body">Zephyr (DC)</text>

  <text x="40" y="158" class="t lbl">TEST MANAGEMENT BACKEND</text>
  <rect x="40" y="166" width="170" height="32" rx="4" class="seg"/>
  <text x="76" y="187" class="t body">Xray</text>
  <rect x="210" y="166" width="170" height="32" class="seg"/>
  <text x="240" y="187" class="t body">Kiwi TCMS</text>
  <rect x="380" y="166" width="200" height="32" rx="4" class="segon"/>
  <text x="400" y="187" class="t onlbl">Zephyr Essential</text>

  <text x="40" y="232" class="t lbl">JIRA URL</text>
  <rect x="40" y="240" width="400" height="30" rx="4" class="field"/>
  <text x="50" y="260" class="t mono body">https://jira.example.internal</text>

  <text x="470" y="232" class="t lbl">ZEPHYR API</text>
  <rect x="470" y="240" width="290" height="30" rx="4" class="panel"/>
  <text x="480" y="260" class="t muted">Data Center  ·  /rest/zapi/latest</text>

  <text x="40" y="298" class="t lbl">PERSONAL ACCESS TOKEN</text>
  <rect x="40" y="306" width="400" height="30" rx="4" class="field"/>
  <text x="50" y="326" class="t mono body">••••••••••••••••••••••••</text>
  <text x="40" y="352" class="t small">Stored in Windows Credential Manager, never in the database.</text>

  <rect x="470" y="306" width="290" height="30" rx="4" class="btng"/>
  <text x="530" y="326" class="t body">Test connection</text>

  <rect x="40" y="372" width="720" height="104" rx="5" class="panel"/>
  <text x="54" y="394" class="t lbl">DETECTED ON CONNECT</text>
  <text x="54" y="416" class="t ok">Zephyr present, Test issue type id 9</text>
  <text x="54" y="436" class="t ok">Execution statuses: UNEXECUTED, PASS, FAIL, WIP, BLOCKED, PASS WARNING</text>
  <text x="54" y="456" class="t ok">Step results addressable, with comments and defect links</text>

  <text x="430" y="416" class="t no">No test repository folders</text>
  <text x="430" y="436" class="t no">No preconditions, no datasets</text>
  <text x="430" y="456" class="t no">Executions only, no test sets or plans</text>

  <text x="40" y="500" class="t warn">Four views are unavailable on this backend. They stay visible and explain why.</text>

  <rect x="610" y="512" width="70" height="30" rx="4" class="btng"/>
  <text x="630" y="532" class="t body">Cancel</text>
  <rect x="690" y="512" width="70" height="30" rx="4" class="btn"/>
  <text x="712" y="532" class="t onlbl">Save</text>
</svg>
