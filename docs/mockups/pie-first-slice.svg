<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" font-family="Segoe UI, Roboto, sans-serif" font-size="13" role="img" aria-label="Project Issue Explorer with a JQL box, a Run button and a table of query results from several projects">
